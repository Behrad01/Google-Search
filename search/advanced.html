<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>

        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="navbar">
            <a id="google-a" href="index.html">Google</a>

            <a href="index.html">Google Search</a>
            <a href="image_search.html">Image Search</a>
        </div>
        <div id="search-div">
            <form action="https://www.google.com/search">
                <div id="inputs-div">
                    <div class="advanced-divs">
                        All these words:
                        <input class="advanced-inputs" type="text" name="as_q">
                    </div>
                    <div class="advanced-divs">
                        This exact word or phrase:
                        <input class="advanced-inputs" type="text" name="as_epq">
                    </div>
                    <div class="advanced-divs">
                        Any of these words:
                        <input class="advanced-inputs" type="text" name="as_oq">
                    </div>
                    <div class="advanced-divs">
                        None of these words:
                        <input class="advanced-inputs" type="text" name="as_eq">
                    </div>
                </div>
                <div id="button-div">
                    <input id="submit-button-advanced" type="submit" value="Advanced Search">
                </div>
            </form>
        </div>
    </body>
</html>
